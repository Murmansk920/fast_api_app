services:
  backend:
    build: .                  # 使用根目录的 Dockerfile
    container_name: fast-api-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
    volumes:
      - ./data:/app/data      # 挂载根目录的 data 文件夹，持久化 sqlite 数据
    restart: unless-stopped

  frontend:
    build: ./frontend         # 使用 frontend 目录下的 Dockerfile
    container_name: fast-api-frontend
    ports:
      - "8090:80"             # 宿主机 8090 映射前端 nginx 的 80
    depends_on:
      - backend               # 确保后端先启动
    restart: unless-stopped